name: Generate demo GIF and commit

on:
  workflow_dispatch: {}
  push:
    branches: [ master, main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-gif:
    name: Generate demo GIF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer --no-audit --no-fund

      - name: Capture frames (Puppeteer)
        run: node scripts/capture_frames.js

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build GIF with palette (ffmpeg)
        run: |
          mkdir -p out
          ffmpeg -y -f image2 -i frames/frame%04d.png -vf fps=12,scale=700:-1:flags=lanczos,palettegen palette.png
          ffmpeg -y -f image2 -i frames/frame%04d.png -i palette.png -filter_complex "fps=12,scale=700:-1:flags=lanczos[x];[x][1:v]paletteuse" out/demo.gif

      - name: Commit and push demo GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p assets
          mv out/demo.gif assets/demo.gif
          git add assets/demo.gif
          git commit -m "Add demo GIF generated by workflow" || echo "No changes to commit"
          git push origin HEAD:master
