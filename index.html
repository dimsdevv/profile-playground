<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Profile Playground — Mini Game</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <style>
    html,body{height:100%;margin:0;background:#0d1117;color:#c9d1d9;font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial}
