<?xml version="1.0" encoding="utf-8"?>
<!-- Animated SVG demo that mimics the mini-game: looping square jump and moving obstacles -->
<svg viewBox="0 0 700 160" xmlns="http://www.w3.org/2000/svg" width="700" height="160">
  <rect width="100%" height="100%" fill="#0d1117" rx="8" />
  <g id="scene" transform="translate(0,0)">
    <!-- ground -->
    <rect x="0" y="140" width="700" height="20" fill="#0b1220" />

    <!-- player (square) -->
    <g id="player">
      <rect id="p" x="64" y="104" width="36" height="36" rx="6" fill="#50c878">
        <animate attributeName="y" dur="1.2s" values="104;60;104" repeatCount="indefinite" keyTimes="0;0.45;1" />
        <animate attributeName="height" dur="1.2s" values="36;32;36" repeatCount="indefinite" keyTimes="0;0.45;1" />
      </rect>
    </g>

    <!-- obstacles group: two obstacles at different phases -->
    <g id="obstacles">
      <rect x="700" y="100" width="36" height="40" rx="6" fill="#c85050">
        <animate attributeName="x" dur="2.4s" values="700; -60" repeatCount="indefinite" />
      </rect>
      <rect x="980" y="108" width="24" height="32" rx="6" fill="#c85050">
        <animate attributeName="x" dur="3s" values="980; -60" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- score text flicker -->
    <text x="12" y="24" fill="#c9d1d9" font-family="Inter,system-ui,Arial" font-size="16">Score: 123</text>

    <!-- subtle decorative dots -->
    <circle cx="620" cy="30" r="6" fill="#7c3aed">
      <animate attributeName="cy" dur="1.6s" values="30;18;30" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="30" r="5" fill="#06b6d4">
      <animate attributeName="cy" dur="1.8s" values="30;22;30" repeatCount="indefinite" />
    </circle>
  </g>
</svg>